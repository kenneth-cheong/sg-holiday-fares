name: Fare sweep (manual)

# No schedule. The dashboard fetches fares live on demand via the API in
# api/lambda_function.py and no longer reads this workflow's output, so
# there is nothing that needs a daily run. This stays as an on-demand tool
# for refreshing docs/data/plan.json (the holiday/leave-planner data) or for
# recording a price snapshot and sending Telegram alerts by hand.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print without writing or notifying"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fare-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -q

      - name: Sweep fares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sweep.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit observations
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "fare-sweep[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --staged --quiet; then
            echo "no new observations to commit"
            exit 0
          fi
          git commit -m "Fares: $(date -u +%Y-%m-%d) sweep"
          # Manual dispatches can overlap; rebase rather than fail so a run
          # never loses its output to a race with another one.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
